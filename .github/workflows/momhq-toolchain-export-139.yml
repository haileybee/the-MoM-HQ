name: MoMHQ Toolchain Export 139

on:
  push:
    branches:
      - momhq-toolchain-export-139

permissions:
  contents: read

jobs:
  export-toolchain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle 8.13
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o /tmp/gradle-8.13-bin.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          echo '20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  /tmp/gradle-8.13-bin.zip' | sha256sum -c -
          unzip -q /tmp/gradle-8.13-bin.zip -d /tmp
          /tmp/gradle-8.13/bin/gradle --version

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Prime exact MoMHQ Gradle dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/momhq-prime/app/src/main
          cat > /tmp/momhq-prime/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MoMHQPrime"
          include(":app")
          EOF
          cat > /tmp/momhq-prime/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.13.2" apply false
              id("org.jetbrains.kotlin.android") version "2.3.21" apply false
          }
          EOF
          cat > /tmp/momhq-prime/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          cat > /tmp/momhq-prime/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.momhq.prime"
              compileSdk = 36
              defaultConfig {
                  applicationId = "com.momhq.prime"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.17.0")
              implementation("androidx.appcompat:appcompat:1.7.1")
              implementation("com.google.android.material:material:1.13.0")
              implementation("com.google.android.gms:play-services-auth:21.6.0")
              implementation("com.google.android.gms:play-services-code-scanner:16.1.0")
              implementation("androidx.credentials:credentials:1.3.0")
              implementation("androidx.credentials:credentials-play-services-auth:1.3.0")
              implementation("com.google.android.libraries.identity.googleid:googleid:1.1.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.9.2")
              implementation("com.android.billingclient:billing-ktx:9.1.0")
          }
          EOF
          cat > /tmp/momhq-prime/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Prime" />
          </manifest>
          EOF
          cd /tmp/momhq-prime
          /tmp/gradle-8.13/bin/gradle --no-daemon :app:dependencies --configuration releaseRuntimeClasspath
          /tmp/gradle-8.13/bin/gradle --no-daemon :app:assembleRelease

      - name: Package toolchain and caches
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/momhq-toolchain-139/android-sdk
          cp -a /tmp/gradle-8.13 /tmp/momhq-toolchain-139/
          cp -a "$ANDROID_HOME/platforms/android-36" /tmp/momhq-toolchain-139/android-sdk/
          mkdir -p /tmp/momhq-toolchain-139/android-sdk/build-tools
          cp -a "$ANDROID_HOME/build-tools/36.0.0" /tmp/momhq-toolchain-139/android-sdk/build-tools/
          cp -a "$ANDROID_HOME/platform-tools" /tmp/momhq-toolchain-139/android-sdk/
          cp -a "$ANDROID_HOME/licenses" /tmp/momhq-toolchain-139/android-sdk/
          mkdir -p /tmp/momhq-toolchain-139/gradle-user-home
          cp -a "$HOME/.gradle/caches" /tmp/momhq-toolchain-139/gradle-user-home/
          if [ -d "$HOME/.gradle/native" ]; then cp -a "$HOME/.gradle/native" /tmp/momhq-toolchain-139/gradle-user-home/; fi
          du -sh /tmp/momhq-toolchain-139
          tar -C /tmp -czf /tmp/momhq-toolchain-139.tar.gz momhq-toolchain-139
          sha256sum /tmp/momhq-toolchain-139.tar.gz > /tmp/momhq-toolchain-139.sha256

      - name: Upload toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: momhq-toolchain-139
          path: |
            /tmp/momhq-toolchain-139.tar.gz
            /tmp/momhq-toolchain-139.sha256
          retention-days: 1
          compression-level: 0
