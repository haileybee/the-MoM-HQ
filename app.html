<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff8da">
  <title>MoM HQ | Web App</title>
  <link rel="stylesheet" href="web-app.css">
  <link rel="stylesheet" href="app-replica.css">
</head>
<body>
  <div id="auth" class="auth-shell">
    <main class="auth-card">
      <div class="sun-logo" aria-hidden="true">🌻</div>
      <p class="eyebrow">MoM HQ</p>
      <h1>Your whole home, one Sunny little helper.</h1>
      <p class="muted">Sign in with Google to use MoM HQ on the web. Your household can sync with the Android app through the same MoM HQ account.</p>
      <button id="googleLogin" class="google-btn" type="button"><span class="google-g">G</span> Continue with Google</button>
      <p id="authStatus" class="fine" aria-live="polite"></p>
      <a class="text-link" href="index.html">← Back to the MoM HQ website</a>
    </main>
  </div>

  <div id="app" class="app-shell hidden">
    <header class="app-header">
      <div><span class="brand">🌻 MoM HQ</span><div id="syncStatus" class="fine">Connecting…</div></div>
      <button id="profileButton" class="profile-button" type="button" aria-label="Open settings">☰</button>
    </header>
    <nav id="topTabs" class="top-tabs" aria-label="MoM HQ sections"></nav>
    <main id="view" class="view" tabindex="-1"></main>
    <nav id="bottomNav" class="bottom-nav" aria-label="Primary navigation"></nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="momhq-config.js"></script>
  <script src="paypal-direct.js"></script>
  <script src="web-app.js"></script>
  <script src="mom-profile.js"></script>
  <script src="app-replica.js"></script>
</body>
</html>
