<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>The Mom Hub</title>
  <style>
:root{
  --bg:#fffaf0;
  --panel:#fffef8;
  --ink:#3d321f;
  --muted:#7f735e;
  --line:#eadfbd;
  --accent:#d6a900;
  --accent-dark:#806700;
  --accent2:#fff1a8;
  --leaf:#617a3a;
  --leaf-soft:#eaf0d9;
  --brown:#6b4f2b;
  --good:#5f7f3f;
  --warn:#b8701f;
  --shadow:0 10px 30px rgba(107,79,43,.10);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:
radial-gradient(circle at 14px 14px,rgba(214,169,0,.07) 2px,transparent 2.5px) 0 0/34px 34px,
linear-gradient(180deg,#fffdf6 0%,var(--bg) 100%);color:var(--ink)}
button,input,select,textarea{font:inherit}.app{max-width:760px;margin:0 auto;min-height:100vh;padding:18px 16px 96px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;font-size:1.15rem;color:var(--brown)}.brand::before{content:'🌻';margin-right:7px}.pill{background:var(--leaf-soft);padding:8px 12px;border-radius:999px;color:var(--leaf);font-weight:800;font-size:.85rem;border:1px solid #d8e2be}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#fffef8,#fff4b8);border:1px solid #ead991;border-radius:24px;padding:22px;box-shadow:var(--shadow);margin-bottom:16px}.hero::after{content:'🌻';position:absolute;right:-8px;bottom:-20px;font-size:6.2rem;opacity:.16;transform:rotate(-12deg);pointer-events:none}.hero h1{position:relative;z-index:1;margin:0 0 8px;font-size:1.75rem;color:var(--brown)}.hero p{position:relative;z-index:1;margin:0;color:var(--muted);line-height:1.45}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:linear-gradient(180deg,#fffefb,#fffaf0);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}.card h3{margin:0 0 7px;font-size:1rem}.small{font-size:.86rem;color:var(--muted)}.metric{font-size:1.6rem;font-weight:900;margin:4px 0;color:var(--brown)}.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}.section-title h2{margin:0;font-size:1.1rem;color:var(--brown)}.section-title h2::before{content:'🌻';font-size:.92rem;margin-right:6px}.btn{border:none;border-radius:14px;padding:12px 14px;background:linear-gradient(180deg,#e0b900,#c99a00);color:#332a10;font-weight:900;cursor:pointer;box-shadow:0 5px 12px rgba(180,135,0,.15)}.btn:hover{filter:brightness(.98)}.btn.secondary{background:var(--leaf-soft);color:var(--leaf);box-shadow:none}.btn.ghost{background:#fffef8;color:var(--brown);border:1px solid var(--line);box-shadow:none}.btn.danger{background:#9e5148;color:white}.btn.full{width:100%}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(760px,100%);background:rgba(255,253,244,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}.nav button{border:0;background:transparent;padding:8px 2px;color:var(--muted);font-size:.72rem}.nav button.active{color:var(--leaf);font-weight:900}.nav button.active .ico{filter:saturate(1.2);transform:scale(1.08)}.nav .ico{display:block;font-size:1.25rem;margin-bottom:2px;transition:.15s}.field{margin-bottom:12px}.field label{display:block;font-weight:800;margin-bottom:6px;color:var(--brown)}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:14px;background:#fffef9;padding:12px;color:var(--ink)}.field input:focus,.field select:focus,.field textarea:focus{outline:3px solid rgba(214,169,0,.18);border-color:var(--accent)}.uploader{border:2px dashed #d5b949;border-radius:18px;padding:18px;text-align:center;background:#fffdf3}.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.thumb{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#f3ebd2}.thumb img{width:100%;height:100%;object-fit:cover}.thumb button{position:absolute;top:4px;right:4px;border:0;background:rgba(61,50,31,.78);color:white;border-radius:50%;width:26px;height:26px}.levels{display:grid;gap:10px}.level{border:2px solid var(--line);border-radius:18px;padding:15px;background:#fffef8;cursor:pointer}.level.selected{border-color:var(--accent);background:#fff8cf;box-shadow:0 0 0 3px rgba(214,169,0,.10)}.level h3{margin:0 0 4px;color:var(--brown)}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{font-size:.75rem;background:var(--leaf-soft);color:var(--leaf);padding:6px 8px;border-radius:999px;font-weight:700}.progress{height:12px;background:#eee4c7;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,var(--leaf),#92a85e);transition:.2s}.task{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.task input{margin-top:4px;transform:scale(1.2);accent-color:var(--leaf)}.task-title{font-weight:800}.task.done .task-title{text-decoration:line-through;color:var(--muted)}.cat{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-dark);font-weight:900}.task-thumb{width:58px;height:58px;border-radius:12px;object-fit:cover;border:1px solid var(--line);margin-left:auto}.empty{text-align:center;color:var(--muted);padding:24px 10px}.empty::before{content:'🌻';display:block;font-size:2rem;margin-bottom:8px}.history-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.overlay-wrap{position:relative;margin-top:10px}.overlay-wrap img{width:100%;border-radius:16px;display:block}.box{position:absolute;border:3px solid #d6a900;border-radius:8px;box-shadow:0 0 0 9999px rgba(60,50,30,.12),0 0 0 3px rgba(255,244,176,.9)}.coming{padding:40px 20px;text-align:center}.modal{position:fixed;inset:0;background:rgba(53,43,25,.48);display:flex;align-items:flex-end;justify-content:center;z-index:50}.sheet{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 16px 30px;border-top:4px solid var(--accent)}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sheet-head h2{color:var(--brown)}.x{border:0;background:#fffef8;border-radius:50%;width:38px;height:38px;font-size:1.2rem;color:var(--brown);border:1px solid var(--line)}.notice{background:#fff6c8;border:1px solid #e4cc65;color:#6a5312;border-radius:14px;padding:12px;font-size:.86rem}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}.actions{grid-template-columns:repeat(5,1fr)}.thumbs{grid-template-columns:repeat(5,1fr)}}
.plan-pill{border:1px solid #d8e2be;cursor:pointer}.sun-badge{font-size:.74rem;font-weight:950;letter-spacing:.12em;color:var(--leaf);text-transform:uppercase}.hero-plan{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding:10px 12px;background:rgba(255,254,248,.75);border:1px solid rgba(214,169,0,.25);border-radius:14px;font-size:.82rem;font-weight:850}.hero-plan button{border:0;background:transparent;color:var(--leaf);font-weight:900;cursor:pointer}.premium-sheet{background:linear-gradient(180deg,#fffdf4,var(--bg))}.price-card{position:relative;overflow:hidden;text-align:center;background:linear-gradient(145deg,#fff8c9,#fffef9);border:1px solid #e7cf67;border-radius:24px;padding:24px 18px;margin:12px 0 18px}.price-card:after{content:'🌻';position:absolute;right:-16px;bottom:-28px;font-size:7rem;opacity:.11;transform:rotate(-15deg)}.trial-burst{display:inline-block;background:var(--leaf);color:white;border-radius:999px;padding:6px 10px;font-size:.72rem;font-weight:950;letter-spacing:.08em}.price{font-size:3.5rem;font-weight:950;line-height:1.1;color:var(--brown);margin-top:8px}.price .dollar{font-size:1.5rem;vertical-align:top;margin-right:2px}.price .per{font-size:1rem;color:var(--muted);font-weight:800}.price-card p{margin:8px 0 0;color:var(--muted);font-weight:750}.premium-list{display:grid;gap:8px;margin:14px 0}.premium-list>div{display:flex;gap:12px;align-items:flex-start;background:#fffef9;border:1px solid var(--line);border-radius:16px;padding:12px}.premium-list>div>span{display:grid;gap:2px}.premium-list small{color:var(--muted);line-height:1.35}.trial-status{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--leaf-soft);color:var(--leaf);padding:12px;border-radius:14px;margin:12px 0;font-size:.86rem}.premium-cta{font-size:1rem;padding:14px}.billing-note{text-align:center;margin-top:10px;line-height:1.4}.success-note{background:var(--leaf-soft);border-color:#ccd9ad;color:var(--leaf);margin-bottom:10px}.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,16px);opacity:0;background:#3d321f;color:#fffdf4;padding:11px 16px;border-radius:999px;font-weight:800;z-index:120;transition:.22s;box-shadow:var(--shadow);white-space:nowrap;max-width:90vw}.toast.show{opacity:1;transform:translate(-50%,0)}


.meal-tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin:10px 0 16px}.meal-tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--panel);padding:9px 12px;border-radius:999px;font-weight:800;color:var(--brown)}.meal-tabs button.active{background:var(--accent2);border-color:#e5c94b}.food-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.food-row:last-child{border-bottom:0}.food-meta{font-size:.82rem;color:var(--muted);margin-top:4px}.status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.use-today{background:#c4532f}.use-soon{background:#d49b17}.fresh{background:#6f8a42}.expired{background:#7b4a4a}.meal-card{border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:10px;background:#fffdf7}.meal-card h3{margin:0 0 6px}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:var(--leaf-soft);color:var(--leaf);font-size:.75rem;font-weight:800;margin:4px 4px 0 0}.danger-text{color:#a7442a}.warn-text{color:#9a6a00}.photo-scan-box{border:2px dashed #e0c75f;border-radius:18px;padding:16px;text-align:center;background:#fff9d9}.mini-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.mini-btn{border:1px solid var(--line);background:#fffdf7;border-radius:10px;padding:7px 9px;font-weight:800;color:var(--brown)}

.kid-tabs{display:flex;gap:8px;overflow:auto;margin:12px 0 16px}.kid-tabs button{border:1px solid var(--line);background:var(--panel);padding:9px 12px;border-radius:999px;font-weight:850;color:var(--muted);white-space:nowrap}.kid-tabs button.active{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.kid-card{background:linear-gradient(160deg,#fffef8,#fff6c9);border:1px solid #ead991;border-radius:20px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}.kid-head{display:flex;gap:12px;align-items:center}.kid-avatar{width:62px;height:62px;border-radius:50%;object-fit:cover;background:#f6e9a5;border:3px solid #fff;box-shadow:0 0 0 1px #e0cf76;display:grid;place-items:center;font-size:2rem;overflow:hidden}.coin-balance{display:inline-flex;align-items:center;gap:6px;background:#fff7c7;border:1px solid #e8d46c;border-radius:999px;padding:6px 10px;font-weight:950;color:var(--brown)}
.chore-item,.reward-item,.tx-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.chore-item:last-child,.reward-item:last-child,.tx-item:last-child{border-bottom:0}.reward-img{width:58px;height:58px;object-fit:cover;border-radius:14px;background:#f5edc8;border:1px solid var(--line)}.status-pill{font-size:.72rem;padding:4px 8px;border-radius:999px;font-weight:900;background:var(--leaf-soft);color:var(--leaf)}.status-pill.pending{background:#fff0c5;color:#9a6412}.status-pill.done{background:#e6f2d8;color:#4f6d31}

.auth-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 18px 18px,rgba(214,169,0,.08) 2px,transparent 2.5px) 0 0/38px 38px,linear-gradient(180deg,#fffdf4,#fff8df)}
.auth-card{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:26px;box-shadow:var(--shadow);text-align:center}.auth-logo{font-size:3.2rem}.auth-card h1{margin:8px 0 4px;color:var(--brown)}.auth-card p{color:var(--muted);line-height:1.45}.social-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 14px;border:1px solid var(--line);border-radius:15px;background:#fff;color:var(--ink);font-weight:800;margin:9px 0;cursor:pointer}.social-btn:hover{transform:translateY(-1px)}.auth-note{font-size:.8rem;color:var(--muted);margin-top:14px}.pay-icons{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.pay-icon{padding:7px 10px;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:800;font-size:.78rem}.settings-list{display:grid;gap:12px}.settings-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px}.settings-card h3{margin:0 0 5px}.status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#b8a989}.status-dot.on{background:var(--good)}.dev-field{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff;margin:5px 0 9px}.sync-banner{padding:10px 12px;border-radius:14px;background:var(--leaf-soft);border:1px solid #d8e2be;color:var(--leaf);font-size:.86rem;font-weight:700}.danger-link{color:#9a3e34;font-weight:800;cursor:pointer}

</style>
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const $ = s => document.querySelector(s);
const state = JSON.parse(localStorage.getItem('tmh_state')||localStorage.getItem('mcc_state')||'null') || {
  tab:'home', sessions:[], active:null,
  subscription:{trialStartedAt:new Date().toISOString(),premium:false},
  demo:{cleaningProgress:0, dinner:'Not planned', laundry:'No timer', chores:'0 complete', expiring:'2 items soon'},
  kids:[], choreTx:[], kidsView:'profiles'
};
if(!state.subscription) state.subscription={trialStartedAt:new Date().toISOString(),premium:false};
if(!state.foods) state.foods=[];
if(!state.staples) state.staples=['Flour','Sugar','Rice','Pasta','Butter','Milk','Eggs','Cooking Oil','Salt'];
if(!state.grocery) state.grocery=[];
if(!state.mealPrefs) state.mealPrefs={familySize:4,dislikes:'',diet:''};
if(!state.mealView) state.mealView='inventory';
if(!state.kids) state.kids=[];
if(!state.choreTx) state.choreTx=[];
if(!state.kidsView) state.kidsView='profiles';
if(!state.laundry) state.laundry={washerMinutes:45,dryerMinutes:60,loads:[],proofEnabled:true};
if(!state.laundry.loads) state.laundry.loads=[];
if(state.laundry.washerMinutes==null) state.laundry.washerMinutes=45;
if(state.laundry.dryerMinutes==null) state.laundry.dryerMinutes=60;
if(state.laundry.proofEnabled==null) state.laundry.proofEnabled=true;
if(!state.account) state.account={loggedIn:false,email:'',name:'',provider:'',userId:''};
if(!state.integrations) state.integrations={supabaseUrl:'',supabaseKey:'',stripeCheckoutUrl:''};
if(!state.syncMeta) state.syncMeta={lastSyncedAt:null,status:'local'};
function save(){localStorage.setItem('tmh_state',JSON.stringify(state)); if(state.account?.loggedIn && state.integrations?.supabaseUrl && state.integrations?.supabaseKey){queueCloudSync()}}
let syncTimer=null;function queueCloudSync(){clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncToCloud(),700)}
function getSupabaseClient(){try{if(!window.supabase||!state.integrations.supabaseUrl||!state.integrations.supabaseKey)return null;return window.supabase.createClient(state.integrations.supabaseUrl,state.integrations.supabaseKey)}catch(e){return null}}
async function syncToCloud(){const sb=getSupabaseClient();if(!sb||!state.account.loggedIn||!state.account.userId)return;try{const payload=JSON.parse(JSON.stringify(state));delete payload.integrations;const {error}=await sb.from('household_state').upsert({user_id:state.account.userId,state_json:payload,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;state.syncMeta={lastSyncedAt:new Date().toISOString(),status:'synced'};localStorage.setItem('tmh_state',JSON.stringify(state))}catch(e){state.syncMeta.status='error';console.warn('Cloud sync failed',e)}}
async function loadCloudState(){const sb=getSupabaseClient();if(!sb||!state.account.userId)return;try{const {data,error}=await sb.from('household_state').select('state_json').eq('user_id',state.account.userId).maybeSingle();if(error)throw error;if(data?.state_json){const cloud=data.state_json;const keepIntegrations=state.integrations;Object.keys(state).forEach(k=>delete state[k]);Object.assign(state,cloud);state.integrations=keepIntegrations;state.account.loggedIn=true;localStorage.setItem('tmh_state',JSON.stringify(state))}state.syncMeta={lastSyncedAt:new Date().toISOString(),status:'synced'};render()}catch(e){console.warn('Cloud load failed',e)}}
function setTab(t){state.tab=t; save(); render()}
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function esc(s=''){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}


function authScreen(){return `<div class="auth-shell"><div class="auth-card"><div class="auth-logo">🌻</div><h1>The Mom Hub</h1><p>Your home, meals, kids, chores, and laundry in one cozy little command center.</p><div style="margin:20px 0"><button class="social-btn" onclick="socialLogin('google')">🟢 Continue with Google</button><button class="social-btn" onclick="socialLogin('facebook')">🔵 Continue with Facebook</button><button class="social-btn" onclick="socialLogin('apple')"> Continue with Apple</button></div><div class="auth-note">Sign in to keep your household data available across devices. Social login becomes live after a Supabase project is connected.</div><button class="btn ghost full" style="margin-top:14px" onclick="demoLocalLogin()">Preview app on this device</button></div></div>`}
async function socialLogin(provider){const sb=getSupabaseClient();if(!sb){alert('Social login is ready, but this prototype still needs your Supabase project URL and publishable key connected in Developer Setup. Use Preview App for now.');return}const {error}=await sb.auth.signInWithOAuth({provider,options:{redirectTo:location.href.split('#')[0]}});if(error)alert(error.message)}
function demoLocalLogin(){state.account={loggedIn:true,email:'preview@device.local',name:'Preview Mom',provider:'local',userId:'local-preview'};save();render()}
async function initAuth(){const sb=getSupabaseClient();if(!sb)return;const {data}=await sb.auth.getSession();if(data?.session?.user){const u=data.session.user;state.account={loggedIn:true,email:u.email||'',name:u.user_metadata?.full_name||u.user_metadata?.name||'',provider:u.app_metadata?.provider||'',userId:u.id};localStorage.setItem('tmh_state',JSON.stringify(state));await loadCloudState()}sb.auth.onAuthStateChange(async(_event,session)=>{if(session?.user){const u=session.user;state.account={loggedIn:true,email:u.email||'',name:u.user_metadata?.full_name||u.user_metadata?.name||'',provider:u.app_metadata?.provider||'',userId:u.id};localStorage.setItem('tmh_state',JSON.stringify(state));await loadCloudState()}else if(state.account.provider!=='local'){state.account.loggedIn=false;localStorage.setItem('tmh_state',JSON.stringify(state));render()}})}
async function logout(){const sb=getSupabaseClient();if(sb&&state.account.provider!=='local')await sb.auth.signOut();state.account={loggedIn:false,email:'',name:'',provider:'',userId:''};localStorage.setItem('tmh_state',JSON.stringify(state));render()}
function checkoutPremium(){const url=state.integrations?.stripeCheckoutUrl;if(url){location.href=url}else{alert('Stripe Checkout is ready to connect. Add your Stripe subscription Checkout/Payment Link in More → Developer Setup. Configure it as $3/month with a 7-day trial.') }}
function saveIntegrations(){state.integrations.supabaseUrl=$('#supabaseUrl')?.value.trim()||'';state.integrations.supabaseKey=$('#supabaseKey')?.value.trim()||'';state.integrations.stripeCheckoutUrl=$('#stripeCheckoutUrl')?.value.trim()||'';localStorage.setItem('tmh_state',JSON.stringify(state));alert('Integration settings saved on this device. Reload after connecting Supabase to activate social login.');}
function more(){const sync=state.account.provider==='local'?'Device-only preview':(state.syncMeta?.status==='synced'?'Cloud synced':'Cloud sync ready');return layout(`<div class="hero"><h1>Account & Settings 🌻</h1><p>Manage your Mom Hub account, syncing, Premium, privacy, and app connections.</p></div><div class="settings-list"><div class="settings-card"><h3>👤 Account</h3><div class="small">${esc(state.account.name||state.account.email||'Mom Hub user')}</div><div class="sync-banner" style="margin-top:10px"><span class="status-dot ${state.account.provider!=='local'?'on':''}"></span>${sync}</div><button class="btn ghost full" style="margin-top:10px" onclick="logout()">Log out</button></div><div class="settings-card"><h3>🌻 Premium</h3><div><b>7 days free, then $3/month</b></div><div class="pay-icons"><span class="pay-icon">VISA</span><span class="pay-icon">Mastercard</span><span class="pay-icon">AmEx</span><span class="pay-icon">Discover</span><span class="pay-icon">Apple Pay</span><span class="pay-icon">Google Pay</span><span class="pay-icon">Cash App Pay</span></div><div class="small">Checkout is handled by Stripe so The Mom Hub never stores raw card numbers.</div><button class="btn full" style="margin-top:12px" onclick="checkoutPremium()">Start Premium Checkout</button></div><div class="settings-card"><h3>💵 Payouts</h3><div class="small">Customer payments can include Cash App Pay, but Stripe payouts go to a supported bank account or eligible debit card configured in your Stripe account. A $cashtag is not entered here.</div></div><div class="settings-card"><h3>🔧 Developer Setup</h3><div class="small">These public connection values turn this prototype into live cross-device auth/sync and checkout. Never put a Stripe secret key here.</div><label class="small"><b>Supabase project URL</b></label><input class="dev-field" id="supabaseUrl" value="${esc(state.integrations.supabaseUrl||'')}" placeholder="https://xxxx.supabase.co"><label class="small"><b>Supabase publishable/a function daysUntil(dateStr){if(!dateStr)return null;const today=new Date();today.setHours(0,0,0,0);const d=new Date(dateStr+'T00:00:00');return Math.ceil((d-today)/86400000)}
function foodStatus(f){const d=daysUntil(f.expiration);if(d===null)return {key:'fresh',label:'No expiration'};if(d<0)return {key:'expired',label:`Expired ${Math.abs(d)} day${Math.abs(d)===1?'':'s'} ago`};if(d===0)return {key:'use-today',label:'Use today'};if(d<=3)return {key:'use-soon',label:`Use in ${d} day${d===1?'':'s'}`};return {key:'fresh',label:`${d} days left`}}
function meals(){
 const foods=[...state.foods].sort((a,b)=>{const da=daysUntil(a.expiration),db=daysUntil(b.expiration);return (da===null?99999:da)-(db===null?99999:db)});

 const urgent=foods.filter(f=>{const d=daysUntil(f.expiration);return d!==null&&d<=3});
 return layout(`<div class="hero"><h1>Pantry & Meals 🌻</h1><p>Keep track of what you have, use food before it expires, and turn your groceries into dinner ideas.</p></div>
 <div class="meal-tabs">${[['inventory','🥫 Inventory'],['meals','🍝 Meal Ideas'],['staples','🌾 Staples'],['grocery','🛒 Grocery']].map(([id,l])=>`<button class="${view===id?'active':''}" onclick="setMealView('${id}')">${l}</button>`).join('')}</div>
 ${urgent.length?`<div class="notice"><b>🌻 Use-it-first:</b> ${urgent.slice(0,3).map(f=>esc(f.name)).join(', ')} ${urgent.length>3?`and ${urgent.length-3} more`:''} should be prioritized.</div>`:''}
 ${view==='inventory'?inventoryView(foods):view==='meals'?mealIdeasView():view==='staples'?staplesView():groceryView()}`)}
function setMealView(v){state.mealView=v;save();render()}
function inventoryView(foods){return `<div class="row"><button class="btn" onclick="openAddFood()">+ Add Food</button><button class="btn ghost" onclick="openFoodPhotoScan()">📸 Scan Groceries</button></div>
 <div class="section-title"><h2>Your Food</h2><span>${foods.length} item${foods.length===1?'':'s'}</span></div>
 <div class="card">${foods.length?foods.map(f=>{const s=foodStatus(f);return `<div class="food-row"><div><b>${esc(f.name)}</b><div class="food-meta"><span class="status-dot ${s.key}"></span>${s.label} • ${esc(f.location||'Pantry')} • Qty ${esc(String(f.quantity||1))}</div></div><div class="mini-actions"><button class="mini-btn" onclick="editFood('${f.id}')">Edit</button><button class="mini-btn" onclick="deleteFood('${f.id}')">Delete</button></div></div>`}).join(''):`<div class="small">No food added yet. Add what's in your pantry, fridge, or freezer.</div>`}</div>`}
function openAddFood(id){const f=id?state.foods.find(x=>x.id===id):null;const m=document.createElement('div');m.className='modal';m.id='foodModal';m.innerHTML=`<div class="sheet"><div class="sheet-head"><h2 style="margin:0">${f?'Edit':'Add'} Food</h2><button class="x" onclick="document.getElementById('foodModal').remove()">×</button></div>
 <div class="field"><label>Name</label><input id="foodName" value="${f?esc(f.name):''}" placeholder="Chicken breast"></div>
 <div class="row"><div class="field"><label>Quantity</label><input id="foodQty" type="number" min="1" value="${f?.quantity||1}"></div><div class="field"><label>Location</label><select id="foodLoc">${['Pantry','Refrigerator','Freezer','Other'].map(x=>`<option ${f?.location===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
 <div class="field"><label>Expiration date</label><input id="foodExp" type="date" value="${f?.expiration||''}"></div>
 <div class="field"><label>Category</label><select id="foodCat">${['Produce','Meat','Dairy','Frozen','Pantry','Bakery','Drinks','Other'].map(x=>`<option ${f?.category===x?'selected':''}>${x}</option>`).join('')}</select></div>
 <button class="btn full" onclick="saveFood('${f?.id||''}')">Save Food</button></div>`;document.body.appendChild(m)}
function saveFood(id){const name=$('#foodName').value.trim();if(!name)return;const obj={id:id||uid(),name,quantity:Number($('#foodQty').value)||1,location:$('#foodLoc').value,expiration:$('#foodExp').value,category:$('#foodCat').value};if(id){state.foods=state.foods.map(f=>f.id===id?obj:f)}else state.foods.push(obj);save();document.getElementById('foodModal').remove();render()}

function mealIdeasView(){const ideas=generateMealIdeas();return `<div class="card"><div class="row"><div class="field"><label>Family size</label><input id="familySize" type="number" min="1" value="${state.mealPrefs.familySize||4}" onchange="updateMealPrefs()"></div><div class="field"><label>Diet notes</label><input id="dietNotes" value="${esc(state.mealPrefs.diet||'')}" placeholder="optional" onchange="updateMealPrefs()"></div></div></div>
 <div class="section-title"><h2>Use-It-First Meals</h2><span>${ideas.length} ideas</span></div>${ideas.length?ideas.map(m=>`<div class="meal-card"><h3>${m.icon} ${esc(m.name)}</h3><div class="small">${esc(m.why)}</div><div>${m.uses.map(x=>`<span class="tag">Uses ${esc(x)}</span>`).join('')}</div><div class="small" style="margin-top:8px"><b>Missing:</b> ${m.missing.length?m.missing.map(esc).join(', '):'Nothing essential from this simple prototype recipe'}</div>${m.missing.length?`<button class="mini-btn" style="margin-top:8px" onclick='addMissing(${JSON.stringify(m.missing)})'>Add missing to grocery list</button>`:''}</div>`).join(''):`<div class="card"><div class="small">Add a few foods to your inventory and meal ideas will appear here.</div></div>`}`}
function updateMealPrefs(){state.mealPrefs.familySize=Number($('#familySize')?.value)||4;state.mealPrefs.diet=$('#dietNotes')?.value||'';save()}
function generateMealIdeas(){const names=state.foods.map(f=>f.name.toLowerCase()), sorted=[...state.foods].sort((a,b)=>(daysUntil(a.expiration)??9999)-(daysUntil(b.expiration)??9999));if(!sorted.length)return[];const urgent=sorted.filter(f=>{const d=daysUntil(f.expiration);return d!==null&&d<=3});const lead=(urgent[0]||sorted[0]);const n=lead.name;const low=n.toLowerCase();const out=[];if(/chicken|turkey/.test(low))out.push({icon:'🍗',name:`Garlic ${n} Dinner`,why:`Prioritizes ${n}${lead.expiration?' before '+lead.expiration:''}.`,uses:[n,...findOwned(['potato','rice','pasta','spinach'])],missing:missing(['Garlic','Butter'])});else if(/beef|steak|ground/.test(low))out.push({icon:'🥩',name:`Savory ${n} Skillet`,why:`Uses your most urgent protein first.`,uses:[n,...findOwned(['potato','rice','onion'])],missing:missing(['Onion'])});else if(/spinach|lettuce|greens|broccoli|pepper|tomato/.test(low))out.push({icon:'🥬',name:`Use-It-First Veggie Bowl`,why:`Moves ${n} to the front before it wilts.`,uses:[n,...findOwned(['rice','egg','chicken'])],missing:missing(['Rice'])});else out.push({icon:'🍲',name:`Use-It-First ${n} Meal`,why:`Built around ${n}, your highest-priority ingredient.`,uses:[n,...findOwned(['rice','pasta','potato','egg'])],missing:[]});if(state.foods.length>1)out.push({icon:'🍳',name:'Clean-Out-the-Fridge Skillet',why:'Combines several foods you already own to reduce waste.',uses:sorted.slice(0,4).map(f=>f.name),missing:missing(['Eggs'])});return out.slice(0,4)}
function findOwned(keys){return state.foods.filter(f=>keys.some(k=>f.name.toLowerCase().includes(k))).slice(0,3).map(f=>f.name)}
function missing(items){const owned=state.foods.map(f=>f.name.toLowerCase()).concat(state.staples.map(s=>s.toLowerCase()));return items.filter(x=>!owned.some(o=>o.includes(x.toLowerCase())||x.toLowerCase().includes(o)))}
function addMissing(items){items.forEach(name=>{if(!state.grocery.some(g=>g.name.toLowerCase()===name.toLowerCase()))state.grocery.push({id:uid(),name,done:false})});state.mealView='grocery';save();render()}

function ageChoreSuggestions(age){if(age<=4)return [['Put toys in bin',2],['Put dirty clothes in hamper',2],['Carry cup to sink',1],['Help wipe table',2],['Put books on shelf',2]];if(age<=7)return [['Make bed',3],['Put toys away',3],['Put dirty clothes in hamper',2],['Set the table',4],['Put clean clothes in drawers',5],['Feed a pet with supervision',4],['Wipe bathroom sink',4]];if(age<=10)return [['Make bed',3],['Unload silverware',5],['Fold laundry',6],['Vacuum one room',6],['Take out small trash',5],['Help load dishwasher',5],['Clean bedroom floor',7]];return [['Load or unload dishwasher',6],['Do a laundry load',10],['Vacuum and mop a room',10],['Take out trash',7],['Clean bathroom',12],['Help make dinner',10],['Change bed sheets',8]]}
function kidChoresView(){if(!state.kids.length)return `<div class="card"><div class="empty">Add a child profile first.</div></div>`;return state.kids.map(k=>`<div class="kid-card"><div class="kid-head">${kidAvatar(k)}<div style="flex:1"><h3 style="margin:0">${esc(k.name)}</h3><div class="small">Age ${k.age} • <b>${k.coins||0} coins</b></div></div><button class="mini-btn" onclick="openChoreForm('${k.id}')">+ Chore</button></div>
 <div style="margin-top:12px"><button class="mini-btn" onclick="openSuggestions('${k.id}')">🌻 Age-appropriate suggestions</button></div>
 <div class="card" style="margin-top:10px">${k.chores?.length?k.chores.map(c=>`<div class="chore-item"><div style="flex:1"><b>${esc(c.name)}</b><div class="small">🪙 ${c.coins} • ${c.recurring||'One-time'}</div></div><div>${c.status==='pending'?'<span class="status-pill pending">Needs approval</span>':c.status==='complete'?'<span class="status-pill done">Approved</span>':'<span class="status-pill">Open</span>'}</div><div class="mini-actions">${c.status==='open'?`<button class="mini-btn" onclick="markChoreDone('${k.id}','${c.id}')">Done</button>`:''}${c.status==='pending'?`<button class="mini-btn" onclick="approveChore('${k.id}','${c.id}')">Approve</button><button class="mini-btn" onclick="rejectChore('${k.id}','${c.id}')">Not yet</button>`:''}<button class="mini-btn" onclick="deleteChore('${k.id}','${c.id}')">Delete</button></div></div>`).join(''):'<div class="small">No chores assigned yet.</div>'}</div></div>`).join('')}
function openChoreForm(kidId,preset='',coins=3){const k=state.kids.find(x=>x.id===kidId);const m=document.createElement('div');m.className='modal';m.id='choreModal';m.innerHTML=`<div class="sheet"><div class="sheet-head"><h2 style="margin:0">Add Chore for ${esc(k.name)}</h2><button class="x" onclick="document.getElementById('choreModal').remove()">×</button></div><div class="field"><label>Chore</label><input id="choreName" value="${esc(preset)}" placeholder="Make bed"></div><div class="field"><label>ChoreCoins earned</label><input id="choreCoins" type="number" min="0" value="${coins}"></div><div class="field"><label>Schedule</label><select id="choreRepeat"><option>One-time</option><option>Daily</option><option>Weekly</option></select></div><button class="btn full" onclick="saveChore('${kidId}')">Assign Chore</button></div>`;document.body.appendChild(m)}
function saveChore(kidId){const k=state.kids.find(x=>x.id===kidId),name=$('#choreName').value.trim();if(!name)return;k.chores.push({id:uid(),name,coins:Number($('#choreCoins').value)||0,recurring:$('#choreRepeat').value,status:'open'});save();document.getElementById('choreModal').remove();render()}
function openSuggestions(kidId){const k=state.kids.find(x=>x.id===kidId),s=ageChoreSuggestions(k.age);const m=document.createElement('div');m.className='modal';m.id='suggestModal';m.innerHTML=`<div class="sheet"><div class="sheet-head"><div><h2 style="margin:0">Chores for age ${k.age}</h2><div class="small">Suggestions only. You control the job and coin amount.</div></div><button class="x" onclick="document.getElementById('suggestModal').remove()">×</button></div>${s.map(([n,c])=>`<div class="chore-item"><div><b>${esc(n)}</b><div class="small">Suggested: ${c} ChoreCoins</div></div><button class="mini-btn" onclick="useSuggestion('${kidId}',${JSON.stringify(n)},${c})">Add</button></div>`).join('')}</div>`;document.body.appendChild(m)}
function useSuggestion(kidId,name,coins){document.getElementById('suggestModal')?.remove();openChoreForm(kidId,name,coins)}
function markChoreDone(kidId,choreId){const c=state.kids.find(k=>k.id===kidId)?.chores.find(c=>c.id===choreId);if(c)c.status='pending';save();render()}
function approveChore(kidId,choreId){const k=state.kids.find(k=>k.id===kidId),c=k?.chores.find(c=>c.id===choreId);if(!k||!c)return;c.status='complete';k.coins=(k.coins||0)+c.coins;state.choreTx.unshift({id:uid(),kidId,type:'earned',amount:c.coins,label:c.name,date:new Date().toISOString()});save();render();toast(`${k.name} earned ${c.coins} ChoreCoins 🌻`)}
function rejectChore(kidId,choreId){const c=state.kids.find(k=>k.id===kidId)?.chores.find(c=>c.id===choreId);if(c)c.status='open';save();render()}
function deleteChore(kidId,choreId){const k=state.kids.find(k=>k.id===kidId);if(k)k.chores=k.chores.filter(c=>c.id!==choreId);save();render()}
function kidStoreView(){if(!state.kids.length)return `<div class="card"><div class="empty">Add a child profile first.</div></div>`;return state.kids.map(k=>`<div class="kid-card"><div class="kid-head">${kidAvatar(k)}<div style="flex:1"><h3 style="margin:0">${esc(k.name)}'s Store</h3><div class="small"><b>${k.coins||0}</b> ChoreCoins available</div></div><button class="mini-btn" onclick="openRewardForm('${k.id}')">+ Reward</button></div><div class="card" style="margin-top:10px">${k.rewards?.length?k.rewards.map(r=>`<div class="reward-item">${r.photo?`<img class="reward-img" src="${r.photo}">`:'<div class="reward-img" style="display:grid;place-items:center;font-size:1.5rem">🎁</div>'}<div style="flex:1"><b>${esc(r.name)}</b><div class="small">🪙 ${r.cost} ${r.description?'• '+esc(r.description):''}</div></div><button class="mini-btn" onclick="redeemReward('${k.id}','${r.id}')" ${k.coins<r.cost?'disabled':''}>Redeem</button><button class="mini-btn" onclick="deleteReward('${k.id}','${r.id}')">Delete</button></div>`).join(''):'<div class="small">No rewards yet. Add things this child would love to work toward.</div>'}</div></div>`).join('')}
function openRewardForm(kidId){const k=state.kids.find(x=>x.id===kidId);const m=document.createElement('div');m.className='modal';m.id='rewardModal';m.innerHTML=`<div class="sheet"><div class="sheet-head"><h2 style="margin:0">Add Reward for ${esc(k.name)}</h2><button class="x" onclick="document.getElementById('rewardModal').remove()">×</button></div><div class="field"><label>Reward name</label><input id="rewardName" placeholder="30 minutes of game time"></div><div class="field"><label>ChoreCoin price</label><input id="rewardCost" type="number" min="1" value="20"></div><div class="field"><label>Description</label><input id="rewardDesc" placeholder="Optional"></div><div class="field"><label>Reward photo</label><input id="rewardPhoto" type="file" accept="image/*"></div><button class="btn full" onclick="saveReward('${kidId}')">Add Reward</button></div>`;document.body.appendChild(m)}
async function saveReward(kidId){const k=state.kids.find(x=>x.id===kidId),name=$('#rewardName').value.trim();if(!name)return;let photo='';const f=$('#rewardPhoto').files?.[0];if(f)photo=await fileToDataURL(f);k.rewards.push({id:uid(),name,cost:Number($('#rewardCost').value)||1,description:$('#rewardDesc').value.trim(),photo});save();document.getElementById('rewardModal').remove();render()}
function redeemReward(kidId,rewardId){const k=state.kids.find(x=>x.id===kidId),r=k?.rewards.find(x=>x.id===rewardId);if(!k||!r||k.coins<r.cost)return;k.coins-=r.cost;state.choreTx.unshift({id:uid(),kidId,type:'spent',amount:r.cost,label:r.name,date:new Date().toISOString()});save();render();toast(`${r.name} redeemed for ${r.cost} coins 🎁`)}

function kidHistoryView(){return `<div class="card">${state.choreTx.length?state.choreTx.slice(0,50).map(t=>{const k=state.kids.find(x=>x.id===t.kidId);return `<div class="tx-item"><div><b>${esc(k?.name||'Child')}</b><div class="small">${esc(t.label)} • ${new Date(t.date).toLocaleString()}</div></div><div class="coin-balance">${t.type==='earned'?'+':'-'}${t.amount} 🪙</div></div>`}).join(''):'<div class="small">Coin activity will appear here after chores are approved or rewards are redeemed.</div>'}</div>`}


function laundry(){
 const loads=[...state.laundry.loads].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
 return layout(`<section class="hero"><h1>Laundry 🌻🧺</h1><p>Start a load, set the timer, and let The Mom Hub keep poking you until the laundry actually moves.</p></section>
 <div class="grid">
  <div class="card"><h3>Washer default</h3><div class="metric">${state.laundry.washerMinutes}m</div><button class="btn ghost" onclick="editLaundrySettings()">Change</button></div>
  <div class="card"><h3>Dryer default</h3><div class="metric">${state.laundry.dryerMinutes}m</div><button class="btn ghost" onclick="editLaundrySettings()">Change</button></div>
 </div>
 <div class="notice" style="margin-top:12px"><b>📸 Laundry Proof:</b> ${state.laundry.proofEnabled?'On':'Off'}. When a timer ends, the app asks for a fresh photo before the load can move forward. In this browser prototype, photo verification is simulated.</div>
 <div class="actions" style="margin-top:14px"><button class="btn" onclick="startLaundryLoad()">➕ Start Laundry Load</button><button class="btn secondary" onclick="editLaundrySettings()">⚙️ Laundry Settings</button></div>
 <div class="section-title"><h2>Loads</h2></div>
 <div class="card">${loads.length?loads.map(laundryLoadHTML).join(''):'<div class="empty">No laundry loads yet. Start one and I’ll babysit the timer for you. 🌻</div>'}</div>
 <div class="notice" style="margin-top:14px">Browser prototype note: repeated alarm sounds work while this page is open. Background phone alarms and notifications will be added when The Mom Hub becomes an installed mobile app.</div>`)
}
function laundryLoadHTML(load){
 const info=laundryTimeInfo(load);
 const stageLabel={waiting:'Waiting',washer:'Washer',dryer:'Dryer',fold:'Needs Folding',putaway:'Needs Putting Away',complete:'Complete'}[load.stage]||load.stage;
 const action=load.stage==='waiting'?`<button class="btn" onclick="startStage('${load.id}','washer')">Start Washer</button>`:
   load.stage==='washer'?(info.finished?`<button class="btn" onclick="requestLaundryProof('${load.id}','washer')">📸 Washer Done</button>`:`<button class="btn ghost" onclick="addLaundryMinutes('${load.id}',5)">+5 min</button>`):
   load.stage==='dryer'?(info.finished?`<button class="btn" onclick="requestLaundryProof('${load.id}','dryer')">📸 Dryer Done</button>`:`<button class="btn ghost" onclick="addLaundryMinutes('${load.id}',5)">+5 min</button>`):
   load.stage==='fold'?`<button class="btn" onclick="advanceLaundry('${load.id}','putaway')">Folded ✓</button>`:
   load.stage==='putaway'?`<button class="btn" onclick="advanceLaundry('${load.id}','complete')">Put Away ✓</button>`:'';
 return `<div class="history-item" style="align-items:flex-start"><div style="flex:1"><b>${esc(load.name||'Laundry Load')}</b><div class="small">${stageLabel}</div>${info.label?`<div style="margin-top:6px;font-weight:900;color:${info.finished?'var(--warn)':'var(--leaf)'}">${info.label}</div>`:''}${load.snoozed?`<div class="small" style="margin-top:4px">🌻 Reminder saved for later.</div>`:''}</div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${action}<button class="btn ghost" onclick="deleteLaundryLoad('${load.id}')">Delete</button></div></div>`
}
function laundryTimeInfo(load){
 if(!load.endsAt||!['washer','dryer'].includes(load.stage))return {label:'',finished:false};
 const ms=new Date(load.endsAt)-new Date();
 if(ms<=0)return {label:'⏰ Timer finished!',finished:true};
 const total=Math.ceil(ms/1000),m=Math.floor(total/60),s=total%60;
 return {label:`${m}:${String(s).padStart(2,'0')} remaining`,finished:false};
}
function startLaundryLoad(){
 const m=document.createElement('div');m.className='modal';m.id='laundryModal';m.innerHTML=`<div class="sheet"><div class="sheet-head"><h2 style="margin:0">New Laundry Load</h2><button class="x" onclick="document.getElementById('laundryModal').remove()">×</button></div><div class="field"><label>Load name</label><input id="laundryName" placeholder="Kids clothes, towels, bedding..."></div><button class="btn full" onclick="saveLaundryLoad()">Create Load</button></div>`;document.body.appendChild(m)
}
function saveLaundryLoad(){const name=$('#laundryName').value.trim()||'Laundry Load';state.laundry.loads.push({id:uid(),name,stage:'waiting',createdAt:new Date().toISOString(),endsAt:null,snoozed:false});save();document.getElementById('laundryModal').remove();render()}
function startStage(id,stage){const l=state.laundry.loads.find(x=>x.id===id);if(!l)return;const mins=stage==='washer'?state.laundry.washerMinutes:state.laundry.dryerMinutes;l.stage=stage;l.endsAt=new Date(Date.now()+mins*60000).toISOString();l.snoozed=false;save();render();startLaundryTicker()}
function addLaundryMinutes(id,mins){const l=state.laundry.loads.find(x=>x.id===id);if(!l)return;const base=Math.max(Date.now(),new Date(l.endsAt||Date.now()).getTime());l.endsAt=new Date(base+mins*60000).toISOString();l.snoozed=false;save();render()}
function advanceLaundry(id,stage){const l=state.laundry.loads.find(x=>x.id===id);if(!l)return;l.stage=stage;l.endsAt=null;l.snoozed=false;save();render()}
function deleteLaundryLoad(id){state.laundry.loads=state.laundry.loads.filter(x=>x.id!==id);save();render()}
function editLaundrySettings(){
 const m=document.createElement('div');m.className='modal';m.id='laundrySettings';m.innerHTML=`<div class="sheet"><div class="sheet-head"><h2 style="margin:0">Laundry Settings</h2><button class="x" onclick="document.getElementById('laundrySettings').remove()">×</button></div><div class="row"><div class="field"><label>Washer minutes</label><input id="washMins" type="number" min="1" value="${state.laundry.washerMinutes}"></div><div class="field"><label>Dryer minutes</label><input id="dryMins" type="number" min="1" value="${state.laundry.dryerMinutes}"></div></div><label style="display:flex;gap:10px;align-items:center;margin:12px 0"><input id="proofToggle" type="checkbox" ${state.laundry.proofEnabled?'checked':''}> Require Laundry Proof photo</label><button class="btn full" onclick="saveLaundrySettings()">Save Settings</button></div>`;document.body.appendChild(m)
}
function saveLaundrySettings(){state.laundry.washerMinutes=Math.max(1,Number($('#washMins').value)||45);state.laundry.dryerMinutes=Math.max(1,Number($('#dryMins').value)||60);state.laundry.proofEnabled=$('#proofToggle').checked;save();document.getElementById('laundrySettings').remove();render()}
function requestLaundryProof(id,fromStage){
 const l=state.laundry.loads.find(x=>x.id===id);if(!l)return;
 if(!state.laundry.proofEnabled){completeLaundryStage(id,fromStage);return}
 const m=document.createElement('div');m.className='modal';m.id='proofModal';m.innerHTML=`<div class="sheet"><div class="sheet-head"><div><h2 style="margin:0">Laundry Proof 📸</h2><div class="small">${fromStage==='washer'?'Show that you moved the laundry from the washer.':'Show the dryer or clean laundry.'}</div></div><button class="x" onclick="document.getElementById('proofModal').remove()">×</button></div><div class="uploader"><input id="proofPhoto" type="file" accept="image/*" capture="environment" onchange="previewLaundryProof(event)"><div class="small" style="margin-top:8px">Take a new photo. Real AI verification will be connected later.</div></div><div id="proofPreview" style="margin-top:12px"></div><button class="btn full" style="margin-top:12px" onclick="acceptLaundryProof('${id}','${fromStage}')">Use Photo & Continue</button><button class="btn ghost full" style="margin-top:8px" onclick="snoozeLaundry('${id}')">I Can't Complete This Right Now</button></div>`;document.body.appendChild(m)
}
function previewLaundryProof(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#proofPreview').innerHTML=`<img src="${r.result}" style="width:100%;max-height:320px;object-fit:cover;border-radius:18px;border:1px solid var(--line)">`};r.readAsDataURL(f)}
function acceptLaundryProof(id,fromStage){const input=$('#proofPhoto');if(!input?.files?.length){alert('Take or choose a fresh laundry photo first.');return}document.getElementById('proofModal')?.remove();completeLaundryStage(id,fromStage)}
function completeLaundryStage(id,fromStage){const l=state.laundry.loads.find(x=>x.id===id);if(!l)return;if(fromStage==='washer'){l.stage='dryer';l.endsAt=null;save();render();setTimeout(()=>{if(confirm('Washer proof accepted 🌻 Start the dryer timer now?'))startStage(id,'dryer')},50)}else{l.stage='fold';l.endsAt=null;save();render()}}
function snoozeLaundry(id){const l=state.laundry.loads.find(x=>x.id===id);if(!l)return;l.snoozed=true;l.endsAt=new Date(Date.now()+15*60000).toISOString();save();document.getElementById('proofModal')?.remove();render()}
function laundryBeep(){try{const A=window.AudioContext||window.webkitAudioContext;const ctx=new A();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(ctx.destination);o.start();setTimeout(()=>{o.stop();ctx.close()},220)}catch(e){}}
let laundryTicker=null,lastLaundryBeep=0;
function startLaundryTicker(){if(laundryTicker)return;laundryTicker=setInterval(()=>{const finished=state.laundry?.loads?.some(l=>['washer','dryer'].includes(l.stage)&&l.endsAt&&new Date(l.endsAt)<=new Date()&&!l.snoozed);if(state.tab==='laundry')render();if(finished&&Date.now()-lastLaundryBeep>10000){laundryBeep();lastLaundryBeep=Date.now()}},1000)}
function coming(title,icon,text){return layout(`<div class="coming"><div style="font-size:3rem">${icon}</div><h1>${title}</h1><p class="small">${text}</p><div class="notice" style="margin-top:20px">This screen is reserved for the next build phase so we can make the Smart Cleaning feature solid first.</div></div>`)}

function render(){if(!state.account?.loggedIn){$('#app').innerHTML=authScreen();return}let c;if(state.tab==='home')c=home();else if(state.tab==='clean')c=clean();else if(state.tab==='meals')c=meals();else if(state.tab==='kids')c=kids();else if(state.tab==='laundry')c=laundry();else c=more();$('#app').innerHTML=c}

function openScan(){
 const modal=document.createElement('div'); modal.className='modal'; modal.id='scanModal';
 modal.innerHTML=`<div class="sheet"><div class="sheet-head"><h2 style="margin:0">New room scan</h2><button class="x" onclick="closeScan()">×</button></div>
 <div class="field"><label>Room</label><select id="room"><option>Bedroom</option><option>Kitchen</option><option>Living Room</option><option>Bathroom</option><option>Kids Room</option><option>Dining Room</option><option>Basement</option><option>Custom Room</option></select></div>

function levelCard(n,t,d,ch){return `<div class="level ${n===1?'selected':''}" data-level="${n}" onclick="chooseLevel(${n})"><h3>Level ${n} — ${t}</h3><div class="small">${d}</div><div class="chips">${ch.map(x=>`<span class="chip">${x}</span>`).join('')}</div></div>`}
function closeScan(){document.getElementById('scanModal')?.remove()}
function chooseLevel(n){
 if(n>1 && !isPremium()){openPremium();return;}
 window._scan.level=n;document.querySelectorAll('.level').forEach(x=>x.classList.toggle('selected',Number(x.dataset.level)===n))
}
function syncPhotoInput(){const input=$('#photos');if(!input)return;const dt=new DataTransfer();window._scan.files.forEach(f=>dt.items.add(f));input.files=dt.files}
function renderThumbs(){const thumbs=$('#thumbs');if(!thumbs)return;thumbs.innerHTML='';window._scan.files.forEach((f,i)=>{const r=new FileReader();r.onload=()=>{const d=document.createElement('div');d.className='thumb';d.innerHTML=`<img src="${r.result}"><button onclick="removePhoto(${i})">×</button>`;thumbs.appendChild(d)};r.readAsDataURL(f)})}
function addPhotos(e){const incoming=[...e.target.files];const current=window._scan.files||[];const roomLeft=Math.max(0,10-current.length);window._scan.files=current.concat(incoming.slice(0,roomLeft));syncPhotoInput();renderThumbs();if(current.length+incoming.length>10){alert('You can add up to 10 photos to one cleaning list.')}e.target.value=''}
function removePhoto(i){window._scan.files.splice(i,1);syncPhotoInput();renderThumbs()}
function fileToDataURL(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)})}

async function generateSession(){const room=$('#room').value, level=window._scan.level, imgs=await Promise.all(window._scan.files.map(fileToDataURL));const tasks=mockTasks(level,imgs);const s={id:uid(),room,level,date:new Date().toISOString(),images:imgs,tasks};state.sessions.push(s);state.active=s.id;save();closeScan();openSession(s.id)}
function mockTasks(level,imgs){const base=[['Laundry','Pick up visible laundry'],['Trash','Remove visible trash'],['Clutter','Put loose items back where they belong'],['Surfaces','Clear main surfaces'],['Floor','Vacuum or sweep the floor']];
 const l2=[['Laundry','Pick up clothes from the floor'],['Laundry','Put dirty clothes into the hamper'],['Laundry','Start the washer if you have a full load'],['Trash','Throw away cups, wrappers, and empty containers'],['Dishes','Take dishes to the kitchen'],['Clutter','Put toys and loose objects into their homes'],['Surfaces','Clear the nightstand or main table'],['Surfaces','Wipe cleared surfaces'],['Floor','Vacuum the open floor area']];
 const l3=[['Trash','Throw away the visible wrapper'],['Trash','Remove the empty cup or bottle'],['Laundry','Pick up the shirt on the floor'],['Laundry','Gather the visible laundry pile'],['Clutter','Put away the loose toy'],['Clutter','Sort the small pile of miscellaneous items'],['Dishes','Carry any cups or plates to the kitchen'],['Surfaces','Clear the top of the dresser or table'],['Surfaces','Wipe the cleared surface'],['Floor','Pick up anything blocking the floor'],['Floor','Vacuum the whole floor'],['Finishing Touches','Return one out-of-place item to another room']];
 const src=level===1?base:level===2?l2:l3;return src.map((x,i)=>({id:uid(),cat:x[0],title:x[1],done:false,imageIndex:imgs.length?i%imgs.length:null,box:level===3&&imgs.length?{x:10+(i*7)%55,y:10+(i*11)%55,w:20,h:18}:null}))}

function openSession(id){const s=state.sessions.find(x=>x.id===id);if(!s)return;state.active=id;save();const done=s.tasks.filter(t=>t.done).length,total=s.tasks.length,p=total?Math.round(done/total*100):0;const cats=[...new Set(s.tasks.map(t=>t.cat))];const modal=document.createElement('div');modal.className='modal';modal.id='sessionModal';modal.innerHTML=`<div class="sheet"><div class="sheet-head"><div><h2 style="margin:0">${esc(s.room)}</h2><div class="small">Level ${s.level} • ${new Date(s.date).toLocaleString()}</div></div><button class="x" onclick="closeSession()">×</button></div>
 <div class="card"><div class="row"><b>${done} / ${total} complete</b><span style="text-align:right">${p}%</span></div><div class="progress" style="margin-top:8px"><div style="width:${p}%"></div></div></div>
 ${s.images?.length?`<div class="section-title"><h2>Room photos (${s.images.length})</h2></div><div class="card"><div class="thumbs">${s.images.map((img,idx)=>`<div class="thumb" style="position:relative"><img src="${img}"><div style="position:absolute;left:8px;bottom:8px;background:rgba(61,50,31,.8);color:#fff;padding:4px 8px;border-radius:999px;font-size:.75rem">Photo ${idx+1}</div></div>`).join('')}</div><div class="small" style="margin-top:10px">This cleaning list was built from all uploaded photos together.</div></div>`:''}
 ${cats.map(c=>`<div class="section-title"><h2>${c}</h2></div><div class="card">${s.tasks.filter(t=>t.cat===c).map(t=>taskHTML(s,t)).join('')}</div>`).join('')}
 <div class="section-title"><h2>Add your own task</h2></div><div class="row"><input id="newTask" placeholder="e.g. Change bed sheets" style="padding:12px;border:1px solid var(--line);border-radius:14px"><button class="btn" onclick="addTask('${s.id}')">Add</button></div>
 <div style="margin-top:18px" class="notice">Prototype privacy: photos are stored locally in this browser only. Clearing browser storage removes them.</div>
 <button class="btn danger full" style="margin-top:12px" onclick="deleteSession('${s.id}')">Delete Cleaning Session</button></div>`;document.body.appendChild(modal)}
function taskHTML(s,t){const img=t.imageIndex!==null?s.images[t.imageIndex]:null;return `<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${s.id}','${t.id}')"><div style="flex:1"><div class="cat">${t.cat}</div><div class="task-title">${esc(t.title)}</div>${img&&t.box?`<button class="btn ghost" style="padding:6px 9px;margin-top:6px;font-size:.75rem" onclick="showDetection('${s.id}','${t.id}')">📍 Show me where</button>`:''}</div>${img?`<img class="task-thumb" src="${img}">`:''}</div>`}
function toggleTask(sid,tid){const s=state.sessions.find(x=>x.id===sid),t=s.tasks.find(x=>x.id===tid);t.done=!t.done;save();closeSession();openSession(sid);render()}
function addTask(sid){const v=$('#newTask').value.trim();if(!v)return;const s=state.sessions.find(x=>x.id===sid);s.tasks.push({id:uid(),cat:'Custom',title:v,done:false,imageIndex:null,box:null});save();closeSession();openSession(sid)}
function deleteSession(sid){state.sessions=state.sessions.filter(x=>x.id!==sid);save();closeSession();render()}
function closeSession(){document.getElementById('sessionModal')?.remove()}
function showDetection(sid,tid){const s=state.sessions.find(x=>x.id===sid),t=s.tasks.find(x=>x.id===tid);if(!s||!t||t.imageIndex===null)return;const img=s.images[t.imageIndex],b=t.box;const m=document.createElement('div');m.className='modal';m.id='detectModal';m.style.zIndex=80;m.innerHTML=`<div class="sheet"><div class="sheet-head"><div><h2 style="margin:0">${esc(t.title)}</h2><div class="small">Mock Level 3 highlight</div></div><button class="x" onclick="document.getElementById('detectModal').remove()">×</button></div><div class="overlay-wrap"><img src="${img}"><div class="box" style="left:${b.x}%;top:${b.y}%;width:${b.w}%;height:${b.h}%"></div></div><div class="notice" style="margin-top:12px">This box demonstrates how real AI object detection will point to the exact item once we connect a vision model.</div></div>`;document.body.appendChild(m)}

startLaundryTicker();
render(); initAuth();

</script>
</body>
</html>
